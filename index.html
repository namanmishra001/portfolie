<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naman Mishra | Lead Software Engineer @ UST Canada (Toronto)</title>
    <meta name="description" content="Portfolio of Naman Mishra - Lead I Software Engineer at UST Canada. 8+ years building secure distributed systems, banking solutions at RBC, and agentic AI workflows." />
    <meta property="og:title" content="Naman Mishra | Lead Software Engineer" />
    <meta property="og:description" content="Lead Engineer with 8+ years experience building secure, scalable distributed systems using Java, Spring Boot, Kafka, Azure, and Agentic AI." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              background: '#f5f5f7',
              foreground: '#1d1d1f',
              primary: '#059669',
              secondary: '#047857',
            },
            animation: {
              marquee: 'marquee 35s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @keyframes marquee {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-50%, 0, 0); }
      }
      .animate-marquee {
        animation: marquee 35s linear infinite !important;
        will-change: transform;
      }
      .animate-marquee:hover {
        animation-play-state: paused !important;
      }
      body {
        background: #f5f5f7;
        color: #1d1d1f;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
      }
      /* Apple Liquid Glass Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(245, 245, 247, 0.8);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.18);
        border-radius: 9999px;
        border: 2px solid rgba(245, 245, 247, 0.8);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.32);
      }
    </style>
</head>
  <body class="bg-[#f5f5f7] text-[#1d1d1f] antialiased selection:bg-emerald-600 selection:text-white overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
