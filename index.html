<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naman Mishra | Backend Lead & Engineering Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              // Professional Industry Standard Palette (Blue/Indigo/Slate)
              primary: '#2563eb', // Royal Blue 600
              secondary: '#4f46e5', // Indigo 600
              accent: '#0f172a', // Slate 900
              dark: '#0f172a', // Slate 900
              light: '#f8fafc', // Slate 50
              slate: {
                850: '#1e293b',
              }
            },
            backgroundImage: {
              // Lighter grid pattern (Slate 200 instead of 300) for cleaner look
              'grid-pattern': "radial-gradient(#e2e8f0 1px, transparent 1px)",
            },
            animation: {
              'blob': 'blob 10s infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 8s ease-in-out infinite',
              'gradient-x': 'gradient-x 15s ease infinite',
              'shimmer': 'shimmer 2s linear infinite',
              'marquee': 'marquee 40s linear infinite',
              'marquee-reverse': 'marquee-reverse 40s linear infinite',
              // Orbit Animations
              'spin-slow': 'spin 20s linear infinite',
              'spin-slower': 'spin 30s linear infinite',
              'spin-reverse-slow': 'spin-reverse 20s linear infinite',
              'spin-reverse-slower': 'spin-reverse 30s linear infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center'
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center'
                },
              },
              shimmer: {
                from: { backgroundPosition: '0 0' },
                to: { backgroundPosition: '-200% 0' }
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' }
              },
              'marquee-reverse': {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0)' }
              },
              'spin-reverse': {
                to: { transform: 'rotate(-360deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar - Professional Look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      
      /* Engineering Grid Background */
      .bg-engineering-grid {
        background-color: #f8fafc;
        background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* Refined Card Style - Clean & Crisp */
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid #e2e8f0; /* Slate 200 */
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      }
      .glass-card-hover:hover {
        background: #ffffff;
        border-color: #cbd5e1;
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
      }
      
      .text-gradient {
        background: linear-gradient(to right, #2563eb, #4f46e5); /* Blue to Indigo */
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Apple-like Smooth Reveal Animations */
      .reveal-on-scroll {
        opacity: 0;
        transform: translateY(20px); /* Reduced movement for professionalism */
        transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        will-change: opacity, transform;
      }

      .reveal-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Stagger delays for children */
      .stagger-1 { transition-delay: 100ms; }
      .stagger-2 { transition-delay: 200ms; }
      .stagger-3 { transition-delay: 300ms; }
      .stagger-4 { transition-delay: 400ms; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
  <body class="bg-light text-slate-900 antialiased selection:bg-primary selection:text-white overflow-x-hidden font-sans">
    <div id="root"></div>
    <script>
      // Intersection Observer for Scroll Reveals
      document.addEventListener('DOMContentLoaded', () => {
        const observerOptions = {
          root: null,
          rootMargin: '0px',
          threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target); // Only animate once
            }
          });
        }, observerOptions);

        // Function to attach observer to new elements (React hydration safe-ish)
        const observeElements = () => {
          const elements = document.querySelectorAll('.reveal-on-scroll:not(.is-visible)');
          elements.forEach(el => observer.observe(el));
        };

        // Initial check
        observeElements();

        // Re-check periodically for dynamic content
        setInterval(observeElements, 1000);
      });
    </script>
  </body>
</html>
